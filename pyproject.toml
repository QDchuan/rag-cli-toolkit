[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ragcli"
version = "0.1.0"
description = "Modular RAG CLI toolkit — atomic tools, freely composable"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

# Core dependencies are deliberately minimal: the toolkit must stay importable
# (and `ragcli list` must work) even when no optional engine is installed.
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# ── Data pre-processing engines ──────────────────────────────────────────
# Grouped by format family so you install only what your corpus needs.
parse-office = [
    "python-docx>=1.1",     # .docx
    "openpyxl>=3.1",        # .xlsx / .xlsm
    "python-pptx>=0.6",     # .pptx
]
parse-pdf = [
    "pdfplumber>=0.11",     # native text + table extraction
]
parse-web = [
    "trafilatura>=1.8",     # main-content extraction (best precision)
    "readability-lxml>=0.8",  # fallback extractor
    "requests>=2.31",
]
parse-ocr = [
    "paddleocr>=2.7",       # best CJK accuracy
    "easyocr>=1.7",         # multilingual fallback
    "pillow>=10.0",
]
parse-yaml = [
    "pyyaml>=6.0",
]
# Everything needed to ingest every supported format
parse-all = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "pdfplumber>=0.11",
    "trafilatura>=1.8",
    "readability-lxml>=0.8",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

# ── Embedding / retrieval ────────────────────────────────────────────────
embed = [
    "sentence-transformers>=3.0",
    "openai>=1.0",
    "tiktoken>=0.7",
]
retrieve = [
    "chromadb>=0.5",
    "rank-bm25>=0.2",
]
qdrant = ["qdrant-client>=1.9"]
milvus = ["pymilvus>=2.4"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
]

# Convenience meta-extras
all = [
    "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6",
    "pdfplumber>=0.11", "pypdf>=4.0",
    "trafilatura>=1.8", "readability-lxml>=0.8", "requests>=2.31", "pyyaml>=6.0",
    "sentence-transformers>=3.0", "openai>=1.0", "tiktoken>=0.7",
    "chromadb>=0.5", "rank-bm25>=0.2",
]

[project.scripts]
ragcli = "ragcli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragcli*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
