[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragcli"
version = "0.1.0"
description = "RAG data pre-processing — turn any source format into one JSON contract"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

# Deliberately zero hard dependencies.
#
# The CLI must stay importable (and `ragcli list` must keep working) on a machine
# where no parsing engine is installed — otherwise a missing optional library
# breaks discovery, which is the opposite of helpful. Every engine is an extra.
dependencies = []

[project.optional-dependencies]
# ── Format engines, grouped so you install only what your corpus needs ────
office = [
    "python-docx>=1.1",     # .docx
    "openpyxl>=3.1",        # .xlsx / .xlsm
    "python-pptx>=0.6",     # .pptx
]
pdf = [
    "pdfplumber>=0.11",     # native text + table extraction
    "pypdf>=4.0",           # fallback text extraction
]
web = [
    "trafilatura>=1.8",       # main-content extraction (best precision)
    "readability-lxml>=0.8",  # fallback extractor
    "requests>=2.31",
]
ocr = [
    "paddleocr>=2.7",       # best CJK accuracy
    "easyocr>=1.7",         # multilingual fallback
    "pillow>=10.0",
]
yaml = [
    "pyyaml>=6.0",
]

# Everything, for ingesting a heterogeneous corpus
all = [
    "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6",
    "pdfplumber>=0.11", "pypdf>=4.0",
    "trafilatura>=1.8", "readability-lxml>=0.8", "requests>=2.31",
    "pyyaml>=6.0",
]

dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.5",
]

[project.scripts]
ragcli = "ragcli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragcli*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
