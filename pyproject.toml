[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ragcli"
version = "0.1.0"
description = "Modular RAG CLI toolkit — atomic tools, freely composable"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "rank-bm25>=0.2",
    "openai>=1.0",
    "tiktoken>=0.7",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "jsonlines>=4.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
]
qdrant = ["qdrant-client>=1.9"]
milvus = ["pymilvus>=2.4"]

[project.scripts]
ragcli = "ragcli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragcli*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
